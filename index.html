<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS home-screen icon. 180x180, opaque, square: iOS applies its own
         corner mask, so a pre-rounded icon comes out double-rounded. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      content="Aylo AI lets you create powerful AI agents to engage with your customers 24/7 on social media. Boost sales, automate conversations, and grow your business effortlessly."
    />

    <link rel="canonical" href="https://aylo.uz/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aylo AI" />
    <meta property="og:url" content="https://aylo.uz/" />
    <meta property="og:title" content="Aylo AI — Build AI Agents That Sell for You" />
    <meta
      property="og:description"
      content="Aylo AI lets you create powerful AI agents to engage with your customers 24/7 on social media. Boost sales, automate conversations, and grow your business effortlessly."
    />
    <meta property="og:image" content="https://aylo.uz/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aylo AI — Build AI Agents That Sell for You" />
    <meta
      name="twitter:description"
      content="Aylo AI lets you create powerful AI agents to engage with your customers 24/7 on social media. Boost sales, automate conversations, and grow your business effortlessly."
    />
    <meta name="twitter:image" content="https://aylo.uz/og-image.png" />
    <meta name="twitter:image:alt" content="Aylo AI — Build AI Agents That Sell for You" />

    <!--
      Structured data. Deliberately limited to facts that are true today: the
      organisation, the product, and the published tiers with their real som
      prices.

      The tiers below are a hand-kept snapshot of the backend's
      `PricingPackage` rows — the same rows the pricing section fetches at
      runtime from `/api/v1/payment/pricing-packages/`. Crawlers read this
      served HTML and never run the fetch, so the two cannot be collapsed into
      one source: whenever a package is added, renamed or repriced in the
      backend, update this block to match (`price` here is the amount actually
      charged, i.e. `discount_price` when one is set). `npm run check:pricing`
      compares the two and fails if they have drifted.

      There is intentionally NO aggregateRating and NO review block. Both are
      tempting because they render star ratings in search results, but the
      product has no reviews yet, so publishing either would be fabricated
      data submitted to search engines. Add them only from real, attributable
      reviews. Contact points, social profiles and a postal address are
      likewise omitted rather than invented.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://aylo.uz/#organization",
            "name": "Aylo AI",
            "url": "https://aylo.uz/",
            "logo": "https://aylo.uz/apple-touch-icon.png",
            "description": "Aylo AI builds AI sales agents that talk to your customers on social media around the clock."
          },
          {
            "@type": "WebSite",
            "@id": "https://aylo.uz/#website",
            "url": "https://aylo.uz/",
            "name": "Aylo AI",
            "publisher": { "@id": "https://aylo.uz/#organization" },
            "inLanguage": ["uz", "ru", "en"]
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://aylo.uz/#software",
            "name": "Aylo AI",
            "applicationCategory": "BusinessApplication",
            "applicationSubCategory": "AI sales agent",
            "operatingSystem": "Web browser",
            "url": "https://aylo.uz/",
            "publisher": { "@id": "https://aylo.uz/#organization" },
            "inLanguage": ["uz", "ru", "en"],
            "description": "Create AI agents that answer your customers on social media 24/7. Priced per conversation, in som.",
            "offers": {
              "@type": "AggregateOffer",
              "priceCurrency": "UZS",
              "lowPrice": "0",
              "highPrice": "699000",
              "offerCount": "3",
              "url": "https://aylo.uz/#pricing",
              "offers": [
                {
                  "@type": "Offer",
                  "name": "Free",
                  "description": "100 conversations per month. One AI agent, website widget, knowledge base. No card required.",
                  "price": "0",
                  "priceCurrency": "UZS",
                  "url": "https://aylo.uz/#pricing",
                  "availability": "https://schema.org/InStock"
                },
                {
                  "@type": "Offer",
                  "name": "Basic",
                  "description": "2000 conversations per month. Telegram and Instagram, lead management and export, follow-up automation.",
                  "price": "239000",
                  "priceCurrency": "UZS",
                  "url": "https://aylo.uz/#pricing",
                  "availability": "https://schema.org/InStock",
                  "priceSpecification": {
                    "@type": "UnitPriceSpecification",
                    "price": "239000",
                    "priceCurrency": "UZS",
                    "valueAddedTaxIncluded": false,
                    "unitCode": "MON",
                    "unitText": "month"
                  }
                },
                {
                  "@type": "Offer",
                  "name": "Pro",
                  "description": "10000 conversations per month. Team members, amoCRM and Billz integrations, broadcasts, priority support.",
                  "price": "699000",
                  "priceCurrency": "UZS",
                  "url": "https://aylo.uz/#pricing",
                  "availability": "https://schema.org/InStock",
                  "priceSpecification": {
                    "@type": "UnitPriceSpecification",
                    "price": "699000",
                    "priceCurrency": "UZS",
                    "valueAddedTaxIncluded": false,
                    "unitCode": "MON",
                    "unitText": "month"
                  }
                }
              ]
            }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
